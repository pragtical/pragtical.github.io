<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pragtical WebAssembly</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#282c34;color:#b6becc;font:14px system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
    #status{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;pointer-events:none}
    #status[hidden]{display:none}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Pragtical editor"></canvas>
  <div id="status" role="status">Loading Pragtical...</div>
  <script src="host.js"></script>
</body>
</html>
